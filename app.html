<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Olympiad">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Olympiad Practice</title>
<style>
:root{
  --bg:#f3f5fb; --card:#ffffff; --ink:#172033; --muted:#5b6680; --line:#e1e6f0; --soft:#eef1f8;
  --brand:#4f46e5; --brand2:#7c3aed; --onbrand:#fff;
  --ok:#0f9960; --okbg:#e3f6ec; --bad:#d93a44; --badbg:#fde9ea; --warn:#b97400; --warnbg:#fff3d9; --new:#5b6680; --newbg:#eef1f8;
  --shadow:0 4px 18px rgba(23,32,51,.07);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1320; --card:#181d2d; --ink:#e8ecf6; --muted:#9aa5bf; --line:#2a3148; --soft:#20263a;
    --brand:#7c79ff; --brand2:#a78bfa; --okbg:#123326; --ok:#3ccf8e; --badbg:#3a1a1f; --bad:#ff6b74; --warnbg:#3a2d10; --warn:#f2b441; --newbg:#232a40; --new:#9aa5bf;
    --shadow:0 4px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{margin:0;line-height:1.25}
.muted{color:var(--muted)} .small{font-size:.9rem} .center{text-align:center}
/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,var(--brand),var(--brand2));color:var(--onbrand);padding:calc(10px + var(--safe-t)) 20px 12px;display:flex;align-items:center;gap:14px}
.top .logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px;flex:none}
.top h1{font-size:1.25rem}
.top .sub{font-size:.85rem;opacity:.85}
.top .grow{flex:1;min-width:0}
.top select{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:9px 12px;min-height:44px;max-width:200px}
.top select option{color:#172033}
main{max-width:1120px;margin:0 auto;padding:20px 20px calc(100px + var(--safe-b))}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b)}
.tabbar button{flex:1;max-width:180px;background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.8rem;font-weight:600;min-height:62px}
.tabbar button .ic{font-size:1.45rem;line-height:1.1}
.tabbar button.on{color:var(--brand)}
/* cards & layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile .v{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.tile .l{color:var(--muted);font-size:.9rem;font-weight:600}
.section-title{font-size:1.3rem;margin:6px 0 2px}
.subj{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-height:150px;position:relative;overflow:hidden}
.subj::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.subj .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;font-weight:800;background:var(--soft);background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.subj .nm{font-size:1.15rem;font-weight:800}
.subj .meta{font-size:.88rem;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand))}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:48px;font-weight:700;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.big{min-height:60px;font-size:1.08rem;padding:14px 22px}
.btn:disabled{opacity:.45}
.mode{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:16px;min-height:96px}
.mode .ic{font-size:30px;flex:none}
.mode b{display:block;font-size:1.05rem}
.mode span{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:9px 16px;min-height:44px;font-weight:600;font-size:.95rem}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.weak{background:var(--badbg);color:var(--bad)} .pill.improving{background:var(--warnbg);color:var(--warn)}
.pill.strong{background:var(--okbg);color:var(--ok)} .pill.new{background:var(--newbg);color:var(--new)}
.pill.pass{background:var(--okbg);color:var(--ok)} .pill.fail{background:var(--badbg);color:var(--bad)}
.topic-row{display:grid;grid-template-columns:minmax(150px,1.1fr) 2fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.topic-row:first-child{border-top:0}
.topic-row .tip{grid-column:1/-1;font-size:.92rem;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:-4px}
.list-item{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .grow{flex:1;min-width:0}
.notice{border-radius:16px;padding:14px 16px;background:var(--warnbg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:700;color:var(--muted)}
.field input,.field select,textarea{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
/* quiz */
.quiz{max-width:960px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.2rem;background:var(--soft);padding:8px 14px;border-radius:12px}
.timer.low{background:var(--badbg);color:var(--bad)}
.qtext{font-size:1.35rem;font-weight:650;line-height:1.5;margin:6px 0 4px}
.qtopic{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.opts{display:grid;gap:12px;margin-top:16px}
@media (min-width:1000px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:66px;padding:14px 18px;border:2px solid var(--line);background:var(--card);border-radius:16px;font-size:1.15rem;font-weight:550}
.opt .k{flex:none;width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:1rem}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card))}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)} .opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)} .opt.wrong .k{background:var(--bad);color:#fff}
.explain{margin-top:16px;border-radius:16px;padding:14px 16px;background:var(--soft);font-size:1rem}
.explain b{display:block;margin-bottom:2px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.palette button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.palette button.done{background:color-mix(in srgb,var(--brand) 14%,var(--card));border-color:var(--brand)}
.palette button.cur{outline:3px solid var(--brand);outline-offset:1px}
.palette button.right{background:var(--okbg);border-color:var(--ok)} .palette button.wrong{background:var(--badbg);border-color:var(--bad)}
.qnav{display:flex;gap:12px;margin-top:20px}
.qnav .btn{flex:1}
.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);margin:0 auto}
.score-ring>div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:2rem;font-weight:800}
.review-q{padding:16px 0;border-top:1px solid var(--line)}
.review-q:first-child{border-top:0}
.ans{margin-top:6px;font-size:.98rem}
.ans .r{color:var(--ok);font-weight:700} .ans .w{color:var(--bad);font-weight:700}
/* certificate */
.cert{max-width:900px;margin:0 auto;background:#fffdf6;color:#1d2433;border:10px double #c69a2b;border-radius:18px;padding:44px 36px;text-align:center}
.cert .kick{letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;font-weight:800;color:#8a6200}
.cert h2{font-size:2.3rem;margin:10px 0;font-family:Georgia,"Times New Roman",serif}
.cert .name{font-size:2.4rem;font-weight:800;color:#3730a3;border-bottom:2px solid #d9cfa8;display:inline-block;padding:4px 30px 8px;margin:14px 0;font-family:Georgia,serif}
.cert .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.cert .grid3 div{background:#f6efd8;border-radius:12px;padding:10px}
.cert .grid3 span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#7a6a3a;font-weight:800}
@media (max-width:700px){.topic-row{grid-template-columns:1fr auto}.topic-row .bar-wrap{grid-column:1/-1;order:3}.cert .grid3{grid-template-columns:1fr}}
@media print{
  .top,.tabbar,.no-print{display:none!important}
  body{background:#fff} main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
  .cert{border-width:8px;margin-top:20mm}
}
</style>
</head>
<body>
<header class="top no-print" id="top"></header>
<main id="main"></main>
<nav class="tabbar no-print" id="tabbar"></nav>

<script src="questions-grade6.js"></script>
<script>
"use strict";
/* ============================== CONFIG ============================== */
const GRADES = [6]; // add 7 here after adding questions-grade7.js
const SUBJECTS = [
  {id:"math",name:"Math",icon:"➗",c:"#4f6bff"},
  {id:"science",name:"Science",icon:"🔬",c:"#14a37f"},
  {id:"english",name:"English",icon:"📖",c:"#e0702a"},
  {id:"gk",name:"General Knowledge",icon:"🌍",c:"#0b9ec0"},
  {id:"hindi",name:"हिंदी",icon:"अ",c:"#d63f6c",lang:"hi-IN"},
  {id:"computers",name:"Computers",icon:"💻",c:"#7c4dff"},
  {id:"reasoning",name:"Logical Reasoning",icon:"🧩",c:"#c08a00"}
];
const TIPS = {
  "Number System":"Revise place value (Indian & International), Roman numerals and estimation. Do 5 'build the smallest/largest number' questions daily.",
  "Factors & Multiples":"Memorise divisibility rules (2,3,4,5,6,8,9,10,11) and primes up to 50. Practise HCF/LCM by prime factorisation.",
  "Fractions & Decimals":"Always convert to a common denominator before adding. Line up decimal points. Compare decimals by adding zeros (0.5 = 0.500).",
  "Integers":"Use a number line. Rule: subtracting a negative = adding. Two negatives added stay negative.",
  "Algebra":"Practise 'undo' steps: to solve 3x + 4 = 19, subtract 4 then divide by 3. Translate word statements into expressions.",
  "Ratio & Proportion":"Always simplify ratios with HCF. Use the unitary method: find the value of ONE first, then multiply.",
  "Geometry":"Learn angle facts (90°, 180°, 360°), types of triangles, symmetry, and faces/edges/vertices of 3-D shapes. Draw a quick figure for every question.",
  "Mensuration":"Know: Perimeter of rectangle = 2(l+b), Area = l×b, square: 4s and s². Always write units.",
  "Data Handling":"Practise mean, mode, range and reading pictographs/bar graphs. Count carefully from the key/scale.",
  "Mental Math":"Learn tables to 20, squares to 25, and tricks like ×25 = ×100÷4, ×5 = ×10÷2. Do a 5-minute speed drill daily.",
  "Food & Health":"Make a chart: nutrient → source → deficiency disease. Revise food tests (iodine, CuSO₄, paper test).",
  "Materials & Separation":"Link each method to its use: handpicking, winnowing, sieving, sedimentation, filtration, evaporation. Revise transparent/translucent/opaque.",
  "Changes Around Us":"Sort examples into reversible vs irreversible changes. Remember expansion/contraction examples.",
  "Plants":"Label diagrams of leaf, root and flower. Learn tap vs fibrous roots, venation, photosynthesis, transpiration.",
  "Body & Movement":"Learn joint types with one example each and how animals (earthworm, snail, fish, birds) move.",
  "Living Things":"Study adaptations by habitat: desert, polar, aquatic, grassland. Ask 'why does this feature help?'.",
  "Motion & Measurement":"Revise types of motion with examples and SI units/conversions (mm, cm, m, km).",
  "Light":"Practise luminous/non-luminous, shadows, pinhole camera and mirror images with small activities at home.",
  "Electricity & Magnets":"Revise conductors vs insulators, circuits, magnet poles and properties. Draw a simple circuit.",
  "Air & Water":"Know air composition (78% N₂, 21% O₂) and the water cycle steps: evaporation → condensation → precipitation.",
  "Vocabulary":"Learn 10 new words a day with synonym and antonym. Read a short story daily and note new words.",
  "Grammar":"Revise parts of speech with 3 examples each. Practise subject–verb agreement, degrees of comparison and plurals.",
  "Verbs & Tenses":"Make a table of 30 irregular verbs (go-went-gone). Practise identifying the tense from time words (already, yesterday, now).",
  "Articles & Prepositions":"Remember 'an' goes by vowel SOUND (an hour, a university). Practise in/on/at with time and place.",
  "Idioms":"Learn 5 idioms a week and use each in your own sentence.",
  "Spelling":"Write tricky words 3 times, break them into syllables, and do a weekly dictation of 15 words.",
  "Sentence Transformation":"Practise active↔passive and direct↔indirect speech with simple sentences first; check tense changes.",
  "Comprehension":"Read the question FIRST, then the passage. Underline key words and find the exact line that answers.",
  "India":"Revise national symbols, states & capitals, rivers and famous monuments with a map.",
  "World":"Revise continents, oceans, capitals and currencies of major countries, with a world map.",
  "Space & Science":"Learn the planets in order with one fact each and India's space missions (Chandrayaan, Aditya-L1, Gaganyaan).",
  "History & People":"Make flash cards: famous Indian personalities → what they are known for.",
  "Sports":"Learn team sizes, sport terms and recent major events/winners. Read the sports page once a week.",
  "Inventions":"Make an inventor → invention table and revise it weekly.",
  "पर्यायवाची":"रोज़ 5 शब्दों के 3-3 पर्यायवाची लिखें और याद करें।",
  "विलोम":"विलोम शब्दों की सूची बनाकर रोज़ 10 शब्द दोहराएँ।",
  "लिंग और वचन":"लिंग और वचन बदलने के नियम (आ→ए, ई→इयाँ) एक तालिका में लिखें और अभ्यास करें।",
  "संज्ञा और सर्वनाम":"संज्ञा के भेद (व्यक्तिवाचक, जातिवाचक, भाववाचक) और सर्वनाम के भेद उदाहरण सहित दोहराएँ।",
  "विशेषण और क्रिया":"हर वाक्य में पहले क्रिया, फिर संज्ञा और उसका विशेषण ढूँढने का अभ्यास करें।",
  "मुहावरे":"हर सप्ताह 5 मुहावरे अर्थ और वाक्य-प्रयोग सहित याद करें।",
  "वर्तनी":"कठिन शब्दों का श्रुतलेख (dictation) करें; मात्राओं (ि/ी, ु/ू) पर ध्यान दें।",
  "शब्द रचना":"संधि, उपसर्ग और प्रत्यय के 10-10 उदाहरण लिखें; अनेक शब्दों के लिए एक शब्द दोहराएँ।",
  "Hardware":"Sort devices into input, output, storage and processing. Label the parts of a computer.",
  "Memory & Storage":"Memorise: 8 bits = 1 byte, 1024 B = 1 KB … TB. Know RAM vs ROM.",
  "Software & OS":"Know examples of system vs application software, browsers, and computer pioneers.",
  "Shortcuts & Keys":"Practise Ctrl + C/V/X/Z/Y/S/P/A on a real computer — doing helps remembering.",
  "MS Office":"Learn what Word, Excel and PowerPoint do, file extensions and cell addresses. Try a simple Excel formula.",
  "Internet & Safety":"Learn full forms (URL, WWW, HTTP) and online safety rules: strong passwords, no sharing personal info, beware phishing.",
  "Coding & Numbers":"Practise decimal↔binary for 0–31 and write small Scratch programs with loops.",
  "Series":"Find the pattern: check differences, ratios, squares/cubes, or letter positions (A=1 … Z=26).",
  "Coding-Decoding":"Write A–Z with numbers 1–26 on rough paper and check the shift for each letter.",
  "Analogy":"Say the relation in words first (\"X is used for Y\"), then apply it to the second pair.",
  "Odd One Out":"Look for the property shared by most items: category, multiple, shape, type.",
  "Directions":"Always draw a quick N-E-S-W sketch. Remember: right turn from North = East.",
  "Blood Relations":"Draw a family tree with + (male) and − (female). Work from the end of the sentence backwards.",
  "Ranking & Order":"Total = left rank + right rank − 1. Draw a line diagram for comparisons.",
  "Calendar & Clock":"Use 'odd days' (days ÷ 7 remainder). Each hour on a clock = 30°.",
  "Math Operations":"Substitute the symbols carefully FIRST, then apply BODMAS."
};

/* ============================== UTILITIES ============================== */
const APP_KEY = "olympiad.data.v1", ACTIVE_KEY = "olympiad.active.v1";
const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[R(0, a.length - 1)];
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const fmt = n => Number(n).toLocaleString("en-IN");
const neg = n => n < 0 ? "−" + Math.abs(n) : String(n);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const subjOf = id => SUBJECTS.find(s => s.id === id);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(str) { let x = 2166136261; for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return (x >>> 0).toString(36); }
function fmtTime(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, "0")}`; }
function fmtDate(iso) { try { return new Date(iso).toLocaleString("en-IN", {day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); } catch (e) { return iso; } }
function dayKey(d) { d = new Date(d); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }

/* ============================== DATA ============================== */
function defaultData() {
  return { version: 1,
    settings: { practiceCount: 10, examCount: 25, examMinutes: 30, passPct: 60, distinctionPct: 85, autoRead: false },
    profiles: [{ id: "p1", name: "My Child", grade: 6 }], activeProfile: "p1", progress: {}, attempts: [] };
}
function loadData() {
  try { const raw = localStorage.getItem(APP_KEY); if (raw) { const d = JSON.parse(raw); const def = defaultData(); d.settings = Object.assign(def.settings, d.settings || {}); d.progress = d.progress || {}; d.attempts = d.attempts || []; if (!d.profiles || !d.profiles.length) { d.profiles = def.profiles; d.activeProfile = "p1"; } return d; } } catch (e) {}
  return defaultData();
}
function save() { try { localStorage.setItem(APP_KEY, JSON.stringify(S.data)); } catch (e) { alert("Could not save progress on this device (storage full or blocked). Please download a backup from Settings."); } }
function saveActive() { try { if (S.quiz && !S.quiz.done) localStorage.setItem(ACTIVE_KEY, JSON.stringify(S.quiz)); else localStorage.removeItem(ACTIVE_KEY); } catch (e) {} }
function profile() { return S.data.profiles.find(p => p.id === S.data.activeProfile) || S.data.profiles[0]; }
function grade() { return profile().grade || 6; }
function prog(subj, pid = profile().id, g = grade()) {
  const P = S.data.progress; P[pid] = P[pid] || {}; P[pid][g] = P[pid][g] || {};

function download(name, text, type) {
  const blob = new Blob([text], { type }), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function restore(text) {
  try { const d = JSON.parse(text); if (!d || !Array.isArray(d.profiles) || !d.settings) throw 0;
    if (!confirm("Replace ALL progress on this device with this backup?")) return;
    S.data = d; save(); S.data = loadData(); alert("Backup restored ✅"); render();
  } catch (e) { alert("That does not look like a valid Olympiad Practice backup."); }
}
function csv() {
  const rows = [["Date", "Child", "Grade", "Subject", "Mode", "Correct", "Wrong", "Skipped", "Total", "Percent", "Result", "Time (s)"]]
    .concat(S.data.attempts.map(a => [a.date, a.name, a.grade, subjOf(a.subj).name, MODE_LABEL[a.mode], a.right, a.wrong, a.skipped, a.total, a.pct, a.mode === "exam" ? (a.distinction ? "Distinction" : a.passed ? "Pass" : "Not passed") : "", a.secs]));
  download("olympiad-history.csv", "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
}

/* ============================== EVENTS ============================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  const act = el.dataset.act, v = el.dataset.v;
  switch (act) {
    case "tab": S.tab = v; S.screen = "tabs"; render(); window.scrollTo(0, 0); break;
    case "open-subj": S.subj = v; S.topicSel = []; S.tab = "practice"; render(); window.scrollTo(0, 0); break;
    case "back-subj": S.subj = null; render(); break;
    case "topic": S.topicSel = S.topicSel.includes(v) ? S.topicSel.filter(t => t !== v) : [...S.topicSel, v]; render(); break;
    case "topic-all": S.topicSel = []; render(); break;
    case "start": if (S.pending && !confirm("Starting a new test will discard the unfinished one. Continue?")) return; startQuiz(S.subj, v, v === "practice" || v === "exam" ? S.topicSel : []); break;
    case "drill": if (S.pending && !confirm("Starting a new test will discard the unfinished one. Continue?")) return; startQuiz(el.dataset.s, "practice", el.dataset.t.split("|")); break;
    case "weak-open": S.weakSubj = v; S.tab = "weak"; render(); break;
    case "weak-subj": S.weakSubj = v; render(); break;
    case "choose": choose(+v); break;
    case "go": go(+v); break;
    case "finish": finishQuiz(false); break;
    case "quit": quitQuiz(); break;
    case "speak": speakQ(); break;
    case "resume": resumeQuiz(); break;
    case "discard": if (confirm("Discard the unfinished test?")) { S.pending = null; try { localStorage.removeItem(ACTIVE_KEY); } catch (x) {} render(); } break;
    case "review": S.screen = "review"; render(); window.scrollTo(0, 0); break;
    case "rev-filter": S.reviewOnlyWrong = v === "1"; render(); break;
    case "back-result": S.screen = "result"; render(); break;
    case "cert": S.screen = "cert"; render(); window.scrollTo(0, 0); break;
    case "again": startQuiz(S.result.subj, S.result.mode === "mistakes" ? "practice" : S.result.mode, S.result.topics); break;
    case "home": S.screen = "tabs"; S.tab = "home"; render(); window.scrollTo(0, 0); break;
    case "view-att": S.result = S.data.attempts.find(a => a.id === v); S.screen = "result"; render(); window.scrollTo(0, 0); break;
    case "hist": S.histFilter = v; render(); break;
    case "print": window.print(); break;
    case "csv": csv(); break;
    case "backup": download(`olympiad-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S.data), "application/json"); break;
    case "copy-backup": (navigator.clipboard ? navigator.clipboard.writeText(JSON.stringify(S.data)).then(() => alert("Backup copied. Paste it into Notes or a message to keep it safe.")) : Promise.reject()).catch(() => alert("Copy is not available here — use Download backup.")); break;
    case "restore-text": restore($("#restoreText").value); break;
    case "reset": if (confirm(`Erase all progress and history for ${profile().name}? This cannot be undone.`)) { delete S.data.progress[profile().id]; S.data.attempts = S.data.attempts.filter(a => a.pid !== profile().id); save(); render(); } break;
    case "add-prof": { const n = prompt("Child's name?"); if (n && n.trim()) { const id = uid("p"); S.data.profiles.push({ id, name: n.trim(), grade: 6 }); S.data.activeProfile = id; save(); render(); } break; }
    case "use-prof": S.data.activeProfile = v; save(); render(); break;
    case "del-prof": { const p = S.data.profiles.find(x => x.id === v); if (p && confirm(`Delete ${p.name} and all their progress?`)) { S.data.profiles = S.data.profiles.filter(x => x.id !== v); delete S.data.progress[v]; S.data.attempts = S.data.attempts.filter(a => a.pid !== v); if (S.data.activeProfile === v) S.data.activeProfile = S.data.profiles[0].id; save(); render(); } break; }
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "profile") { S.data.activeProfile = el.value; save(); render(); }
  else if (el.dataset.set) { const k = el.dataset.set; let val = el.value; if (k === "autoRead") val = val === "true"; else { val = Math.round(+val); if (!(val > 0)) return; } S.data.settings[k] = val; save(); }
  else if (el.dataset.profName) { const p = S.data.profiles.find(x => x.id === el.dataset.profName); if (p && el.value.trim()) { p.name = el.value.trim(); save(); renderTop(); } }
  else if (el.dataset.profGrade) { const p = S.data.profiles.find(x => x.id === el.dataset.profGrade); if (p) { p.grade = +el.value; save(); render(); } }
  else if (el.dataset.act === "restore-file" && el.files[0]) { const r = new FileReader(); r.onload = () => restore(r.result); r.readAsText(el.files[0]); }
});
document.addEventListener("keydown", e => {
  if (S.screen !== "quiz" || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = "abcd".indexOf(e.key.toLowerCase()); if (k >= 0 && k < S.quiz.qs[S.quiz.i].o.length) choose(k);
  else if (e.key === "ArrowRight") go(S.quiz.i + 1); else if (e.key === "ArrowLeft") go(S.quiz.i - 1);
});
if ("speechSynthesis" in window) speechSynthesis.getVoices();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {}); // only used for the optional website install
render();
</script>
